# ============================================================
# Teomoony - MSSQL on Docker Desktop (Windows)
#
# 실행
#   cd C:\Project\Teomoony
#   docker compose --env-file .env -f deploy\docker-compose.yml up -d
#
#   ★ --env-file 이 필수다. compose 는 .env 를 **compose 파일이 있는
#     폴더**(deploy\)에서 찾는다. 이 프로젝트의 .env 는 한 칸 위에 있으므로
#     지정해 주지 않으면 DB_PASSWORD 를 못 봐서 기동이 멈춘다.
#
# 접속
#   서버 : localhost,11433      (1433 은 로컬에 이미 SQL Server 가 있을 수 있어 피함)
#   계정 : sa / .env 의 DB_PASSWORD
#
# 주의 1) user: "0:0"
#   SQL Server 2022 컨테이너는 기본적으로 비root(mssql, uid 10001)로 돈다.
#   named volume 은 root 소유로 생성되므로 그대로 두면
#   "Setup FAILED copying system data file ... Access is denied" 로 기동 실패한다.
#   개발 환경에서는 root 로 띄우는 것이 가장 간단한 해법.
#
# 주의 2) MSSQL_COLLATION
#   DB 생성 후에는 바꿀 수 없다. 한글 정렬/비교가 필요하므로 처음부터 지정한다.
#   (주소 문자열 매칭을 할 거라면 이 설정이 결과를 바꾼다)
# ============================================================
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: teomoony-mssql
    user: "0:0"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?.env 에 DB_PASSWORD 가 필요하다}"
      MSSQL_PID: "Developer"              # Developer 는 Enterprise 기능 전부 + 비상용 무료
      MSSQL_COLLATION: "Korean_Wansung_CI_AS"
      MSSQL_TZ: "Asia/Seoul"
      # 대용량 작업 대비 - 컨테이너에 준 메모리의 80% 정도를 버퍼풀로
      MSSQL_MEMORY_LIMIT_MB: "6144"
    ports:
      - "11433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
      - mssql_log:/var/opt/mssql/log
      - mssql_bak:/var/opt/mssql/backup
      # 대용량 파일 적재용 - EAIS 월배치 / juso 전체분 파일을 여기 두면
      # 컨테이너 안에서 BULK INSERT 로 바로 읽을 수 있다
      - ./bulk:/bulk
    deploy:
      resources:
        limits:
          memory: 8G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  mssql_data:
  mssql_log:
  mssql_bak:
