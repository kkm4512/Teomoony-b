# ============================================================
# Teomoony - MSSQL on Docker Desktop (Windows)
#
# 실행
#   cd C:\Project\Teomoony
#   docker compose --env-file .env -f deploy\docker-compose.yml up -d
#
#   ★ --env-file 이 필수다. compose 는 .env 를 **compose 파일이 있는
#     폴더**(deploy\)에서 찾는다. 이 프로젝트의 .env 는 한 칸 위에 있으므로
#     지정해 주지 않으면 DB_PASSWORD 를 못 봐서 기동이 멈춘다.
#
# 접속
#   서버 : localhost,11433      (1433 은 로컬에 이미 SQL Server 가 있을 수 있어 피함)
#   계정 : sa / .env 의 DB_PASSWORD
#
# 주의 1) user: "0:0"
#   SQL Server 2022 컨테이너는 기본적으로 비root(mssql, uid 10001)로 돈다.
#   named volume 은 root 소유로 생성되므로 그대로 두면
#   "Setup FAILED copying system data file ... Access is denied" 로 기동 실패한다.
#   개발 환경에서는 root 로 띄우는 것이 가장 간단한 해법.
#
# 주의 2) MSSQL_COLLATION
#   DB 생성 후에는 바꿀 수 없다. 한글 정렬/비교가 필요하므로 처음부터 지정한다.
#   (주소 문자열 매칭을 할 거라면 이 설정이 결과를 바꾼다)
# ============================================================
# ★ 2026-11-08 사장님 "컨테이너 이름이 deploy 라 알아보기 힘들다" — 묶음(프로젝트) 이름을 teomoony 로.
#   (전에는 이 파일이 든 폴더 이름 'deploy' 가 그대로 묶음 이름이었다.) DB 저장공간은 옛 이름(deploy_*) 그대로 이어 쓴다 — 아래 volumes.
#   폴더 붙이기는 TM_ROOT · TM_ROOT_F 가 있으면 그것(컨테이너 안에서 compose 를 돌릴 때 /run/desktop/mnt/host/c/Project/...), 없으면 지금처럼 상대 경로.
name: teomoony
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: teomoony-mssql
    stop_grace_period: 120s   # 11-08: 내릴 때 DB 가 깨끗이 닫히도록(기본 10초면 강제 종료 → 켤 때 복구)
    user: "0:0"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?.env 에 DB_PASSWORD 가 필요하다}"
      MSSQL_PID: "Developer"              # Developer 는 Enterprise 기능 전부 + 비상용 무료
      MSSQL_COLLATION: "Korean_Wansung_CI_AS"
      MSSQL_TZ: "Asia/Seoul"
      # 대용량 작업 대비 - 컨테이너에 준 메모리의 80% 정도를 버퍼풀로
      # 2026-10-24 사장님 "메모리 너가 늘려": PC 32GB · Docker(WSL) 15.4GB 안에서 6GB → 11GB(컨테이너 13GB).
      #   더 주려면 %USERPROFILE%\.wslconfig 의 memory= 를 올리고 wsl --shutdown 해야 한다(PC 설정이라 손대지 않음).
      # 2026-10-24 21:28 사장님 "서비스DB 분리 · 너 추천대로": 적재DB(이것) 와 서비스DB(postgis) 가 같은 PC(WSL 15.4GB · CPU 12)를 나눈다.
      #   적재 9.5GB(버퍼 8GB) · CPU 9 / 서비스 3GB · CPU 3 까지 / Redis 1GB.
      MSSQL_MEMORY_LIMIT_MB: "8192"
    ports:
      # 2026-10-29 사장님 "ㄱㄱ"(보안): 이 PC 안에서만(전에는 모든 네트워크 — 같은 와이파이 기기가 sa 로 붙어 볼 수 있었다)
      - "127.0.0.1:11433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
      - mssql_log:/var/opt/mssql/log
      - mssql_bak:/var/opt/mssql/backup
      # 대용량 파일 적재용 - EAIS 월배치 / juso 전체분 파일을 여기 두면
      # 컨테이너 안에서 BULK INSERT 로 바로 읽을 수 있다
      - ${TM_ROOT:-..}/deploy/bulk:/bulk
    deploy:
      resources:
        limits:
          memory: 9728M
          cpus: "9"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ============================================================
  # 서비스DB — PostgreSQL + PostGIS (2026-10-24 사장님 "적재DB → 서비스DB · 서비스DB 는 너 생각대로")
  #   화면(Teomoony-f)은 여기만 읽는다. 적재DB 에서 1시간마다 '끝난 적재분' 만 발행한다.
  #   ★ SQL Server Developer 판은 운영 서버로 쓸 수 없다(Microsoft 문서) — 서비스는 PostgreSQL(제한 없음).
  #   ★ 밖으로 열지 않는다(127.0.0.1). 비밀번호는 .env 의 SVC_DB_PASSWORD(사장님이 넣는다).
  # ============================================================
  postgis:
    image: postgis/postgis:17-3.5
    container_name: teomoony-svc
    stop_grace_period: 120s   # 11-08: 내릴 때 DB 가 깨끗이 닫히도록(기본 10초면 강제 종료 → 켤 때 복구)
    environment:
      POSTGRES_DB: teomoony
      POSTGRES_USER: teomoony
      POSTGRES_PASSWORD: ${SVC_DB_PASSWORD:?SVC_DB_PASSWORD 를 .env 에 넣으세요}
      TZ: "Asia/Seoul"
    command: >
      postgres -c shared_buffers=768MB -c effective_cache_size=2GB -c work_mem=16MB
               -c maintenance_work_mem=256MB -c max_connections=60 -c random_page_cost=1.1
               -c jit=off -c timezone=Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - svc_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teomoony -d teomoony"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Redis — 인기 단지 · 검색 결과 캐시(발행 번호를 키에 넣어 발행 때 저절로 새 판). 넘치면 오래 안 쓴 것부터 버린다.
  redis:
    image: redis:7.4-alpine
    container_name: teomoony-redis
    command: ["redis-server", "--maxmemory", "768mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ============================================================
  # 웹 서버 — Teomoony-f (2026-11-08 사장님 "ㄱㄱ": PowerShell 창 → 도커)
  #   얻는 것: 창을 닫아도 안 꺼짐 · 죽으면 저절로 다시 켬 · 감시 모드(--watch)의 까닭 모를 재시작 없음 · 새 서버로 그대로 옮김.
  #   잃는 것: 소스를 고쳐도 저절로 안 바뀜 → zg-pull-f-par 가 src 가 바뀌었을 때 이 컨테이너를 다시 켠다(2~3초 끊김).
  #   ★ 소스는 이미지에 굽지 않고 폴더를 그대로 붙인다(받기 = 반영). node_modules 도 Teomoony-f 의 것(전부 순수 JS — express · mssql · pg · redis · dotenv).
  #   ★ ../(Teomoony) 도 붙인다 — 서버가 ../../Teomoony 의 .env · logs(web_life.log) · deploy/sql · etl/_export 를 쓴다(같은 상대 위치 /app/…).
  #   ★ DB 는 같은 망의 이름(mssql · postgis · redis)으로 — src/hosts.js (TM_DOCKER=1).
  #   ★ 문은 이 PC 안에서만(127.0.0.1) — Cloudflare 터널이 localhost:5173 으로 들어온다(전과 같음).
  #   시험할 때만 WEB_PORT=5174 처럼 다른 문으로 띄운다(PowerShell: $env:WEB_PORT='5174').
  # ============================================================
  web:
    image: node:24-bookworm-slim
    container_name: teomoony-web
    working_dir: /app/Teomoony-f
    command: ["node", "src/server.js"]
    environment:
      TM_DOCKER: "1"
      TZ: "Asia/Seoul"
    volumes:
      - ${TM_ROOT_F:-../../Teomoony-f}:/app/Teomoony-f
      - ${TM_ROOT:-..}:/app/Teomoony
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2"
    restart: unless-stopped

  # ============================================================
  # 작업 감시기 — watch.cmd(PowerShell 창) → 컨테이너 (2026-11-08 사장님 "ㄱㄱ: 윈도우에 창이 하나도 없게")
  #   _job_runner.py(작업 큐) · collect_cron.py(수집 일정) · disk_guard.py(디스크) 가 이 안에서 돈다. 큐 · 로그 · 작업 이름은 그대로.
  #   얻는 것: 창이 없다 · 죽으면 저절로 다시 · 로그인하면 웹과 같이 뜬다.
  #   잃는 것: PowerShell/cmd 작업은 여기서 안 돈다(etl/_jobs_linux.json 에 리눅스판이 있는 것만) · 윈도우 프로그램(python.exe 등)은 못 본다.
  #   ★ privileged + pid: host — 디스크 지킴이가 도커 디스크(vhdx)를 fstrim 해 C 로 돌려주려면 도커 VM 쪽에서 돌려야 한다.
  #   ★ docker.sock — SQL 적용(docker cp/exec teomoony-mssql) · 웹 다시 켜기(docker restart teomoony-web).
  #   ★ 메모리 4GB 상한 — 도커 VM(15.4GB) 을 적재DB · 서비스DB 와 나눈다. 넘치면 이 안의 작업만 죽고 DB 는 산다.
  #   시험할 때만 RUNNER_QUEUE=_queue_d 처럼 다른 큐로 띄운다(진짜 큐와 겹쳐 같은 작업을 두 번 돌리지 않게).
  # ============================================================
  runner:
    build: ./runner
    image: teomoony-runner:1
    container_name: teomoony-runner
    environment:
      TZ: "Asia/Seoul"
      TM_QUEUE: "${RUNNER_QUEUE:-_queue}"
    volumes:
      - ${TM_ROOT_F:-../../Teomoony-f}:/app/Teomoony-f
      - ${TM_ROOT:-..}:/app/Teomoony
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    pid: host
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: "6"
    restart: unless-stopped

volumes:
  # ★ 11-08: 묶음 이름을 teomoony 로 바꿔도 **옛 저장공간을 그대로** 쓴다(external · 이름 고정) — 안 그러면 teomoony_mssql_data 라는 빈 DB 가 새로 생긴다.
  svc_data:
    name: deploy_svc_data
    external: true
  mssql_data:
    name: deploy_mssql_data
    external: true
  mssql_log:
    name: deploy_mssql_log
    external: true
  mssql_bak:
    name: deploy_mssql_bak
    external: true
